{% load tienda %}
<footer class="pie">
  <div class="pie__grilla">
    <div class="pie__marca">
      <a class="logo logo--claro pie__logo" href="{% url 'productos:home' %}" aria-label="Nutrivid, inicio">nutrivid<span class="logo__punto">.</span></a>
      <p>Dietética en Corrientes.</p>
    </div>
    <nav class="pie__columna" aria-labelledby="pie-tienda">
      <h2 class="pie__rotulo" id="pie-tienda">Tienda</h2>
      <a href="{% url 'productos:catalogo' %}">Catálogo</a>
      <a href="{% url 'productos:catalogo' %}?filtro=ofertas">Ofertas</a>
      <a href="{% url 'productos:catalogo' %}?filtro=nuevos">Novedades</a>
    </nav>
    <div class="pie__columna">
      <h2 class="pie__rotulo">Sucursales</h2>
      <div class="pie__sucursales" id="pieSucursales"><span>Cargando…</span></div>
    </div>
    <div class="pie__columna">
      <h2 class="pie__rotulo">Contacto</h2>
      {% if config_tienda.whatsapp %}
        <a class="pie__contacto pie__contacto--claro" href="https://wa.me/{{ config_tienda.whatsapp }}" target="_blank" rel="noopener">{% icono "whatsapp-logo" %}WhatsApp</a>
      {% endif %}
      <span class="pie__contacto">{% icono "clock" %}Lunes a sábado, de 9 a 20 h</span>
    </div>
  </div>
</footer>
