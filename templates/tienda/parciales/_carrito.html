<aside class="cart-drawer" id="cartDrawer" aria-labelledby="cartTitle" aria-hidden="true">
  <div class="drawer-backdrop" data-close-cart></div>
  <div class="drawer-panel" role="dialog" aria-modal="true">
    <div class="cart-header">
      <div><p class="eyebrow">Tu pedido</p><h2 id="cartTitle">Carrito</h2></div>
      <button class="icon-button" type="button" data-close-cart aria-label="Cerrar carrito"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
    </div>
    <div class="cart-scroll">
      <div class="cart-items" id="cartItems" aria-live="polite"></div>
      <div class="cart-empty" id="cartEmpty">
        <strong>Tu carrito está vacío</strong>
        <span>Agregá productos y enviá el pedido por WhatsApp.</span>
      </div>
      <div class="cart-toolbar" id="cartToolbar" hidden>
        <button type="button" class="cart-clear" id="clearCart"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13M10 11v5.5M14 11v5.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Vaciar carrito</button>
        <span id="cartItemsLabel">0 productos</span>
      </div>
      <div class="cart-customer">
        <h3>Tus datos</h3>
        <p>Completá tu nombre para continuar con el pedido por WhatsApp.</p>
        <label class="sr-only" for="customerName">Nombre y apellido</label>
        <div class="input-with-icon">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M4.5 20c.8-3.6 3.8-5.5 7.5-5.5s6.7 1.9 7.5 5.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <input id="customerName" type="text" placeholder="Nombre y apellido" autocomplete="name">
        </div>
      </div>
    </div>
    <div class="cart-footer">
      <div class="subtotal">
        <div><strong>Subtotal</strong><span id="subtotalCount">0 productos</span></div>
        <strong id="subtotal">$0</strong>
      </div>
      <button class="btn btn-primary btn-full cart-send" type="button" id="sendOrder">
        <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true" focusable="false"><path d="M4 20l1.2-3.6A8 8 0 1 1 8 19z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 8.5c0 3.5 2.6 6.5 6.3 6.8l1-1.6-2-1-.9 1c-1.3-.5-2.4-1.6-2.9-2.9l1-.9-1-2-1.6 1" fill="currentColor"/></svg>
        <span>Enviar pedido por WhatsApp</span>
        <svg class="cart-send-arrow" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><path d="M4 12h15M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <p class="cart-note"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 11v5.5M12 7.6v.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>Confirmamos stock, envío y total final por WhatsApp.</p>
    </div>
  </div>
</aside>
