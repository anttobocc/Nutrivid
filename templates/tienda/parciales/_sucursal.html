{% load tienda %}
<dialog class="panel panel--centro panel--chico" id="dialogoSucursal" aria-labelledby="sucursalTitulo">
  <header class="panel__cabeza">
    <div>
      <h2 id="sucursalTitulo">Elegí tu sucursal</h2>
      <p class="panel__sub">Vas a ver los precios y el stock de esa sucursal.</p>
    </div>
    <button class="boton-icono" type="button" data-cerrar aria-label="Cerrar">{% icono "x" %}</button>
  </header>
  <div class="panel__cuerpo">
    <ul class="sucursales" id="listaSucursales"></ul>
  </div>
</dialog>
