{% load tienda %}
<dialog class="capa capa--hoja" id="dialogoProducto" aria-labelledby="detalleTitulo">
  <div class="capa__velo"></div>
  <div class="hoja hoja--ancha">
    <div class="hoja__agarre" aria-hidden="true"></div>
    <div class="hoja-detalle">
      <div class="hoja-detalle__cerrar">
        <button class="boton-icono boton-icono--cerrar" type="button" data-cerrar aria-label="Cerrar">{% icono "x" %}</button>
      </div>
      <div id="detalleContenido"></div>
    </div>
  </div>
</dialog>
