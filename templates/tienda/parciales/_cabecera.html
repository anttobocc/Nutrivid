{% load tienda %}
<header class="cabecera">
  <div class="cabecera__fila">
    <a class="logo cabecera__logo" href="{% url 'productos:home' %}" aria-label="Nutrivid, ir al inicio">nutrivid<span class="logo__punto">.</span></a>

    <nav class="cabecera__nav" aria-label="Principal">
      <a href="{% url 'productos:home' %}" data-nav="inicio"{% if pagina == "inicio" %} aria-current="page"{% endif %}>Inicio</a>
      <a href="{% url 'productos:catalogo' %}" data-nav="catalogo"{% if pagina == "catalogo" %} aria-current="page"{% endif %}>Catálogo</a>
      <a href="{% url 'productos:catalogo' %}?filtro=ofertas" data-nav="ofertas"{% if pagina == "ofertas" %} aria-current="page"{% endif %}>Ofertas</a>
    </nav>

    <div class="cabecera__centro"></div>

    <div class="cabecera__acciones">
      <button class="pildora-sucursal" id="abrirSucursal" type="button" aria-haspopup="dialog" aria-controls="dialogoSucursal" aria-label="Cargando sucursal" disabled>
        {% icono "map-pin" "i pildora-sucursal__pin" %}
        <span class="pildora-sucursal__texto"><span>Comprás en</span><b data-sucursal-nombre>Cargando…</b></span>
        {% icono "caret-down" "i pildora-sucursal__flecha" %}
      </button>
      <button class="boton-carrito" id="abrirCarrito" type="button" aria-haspopup="dialog" aria-controls="dialogoCarrito" aria-label="Ver pedido, 0 productos" data-abrir-carrito>
        {% icono "shopping-cart-simple" %}
        <span class="boton-carrito__contador" id="carritoContador" aria-live="polite" hidden>0</span>
      </button>
    </div>
  </div>
</header>
